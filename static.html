<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>光圈 · 静帧 | Iris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="corner-link" href="index.html">← 索引</a>

  <script src="p5.min.js"></script>
  <script>
  /* ================================================================
     《光圈 · 静帧》 Iris — Static Composition
     ----------------------------------------------------------------
     作业要求：只用形状、颜色、位置构成画面，不使用 draw() 循环。
     实现方式：全部图形在 setup() 中一次性绘制完成，没有 draw()。

     画面由 24 道同心圆弧构成：半径、线宽、亮度、起止角、圆心偏移
     全部由 for 循环 + 噪声参数化生成，没有一道弧是手摆的。
     圆弧先画进离屏缓冲，模糊后作为辉光贴回来，再叠一层清晰的弧线，
     最后一层胶片颗粒。

     构成逻辑：
       · 主体 —— 24 道同心弧由外向内心收拢，形成"光圈"的节奏
       · 纵深 —— 每一道弧的圆心都比外一道微微偏移 → 自然形成隧道的透视
       · 中心 —— 弧心偏左下，中心一团亮光作为视觉落点，右下留白
       · 冷暖 —— 全场冷色；唯一暖色（米金）只出现在一道弧上
     ================================================================ */

  /* ---------- 1. 调色板（共 5 色：1 个底色 + 4 个前景色） ---------- */
  const COLORS = {
    night: '#050810', // 极夜靛蓝：底色
    deep:  '#12305A', // 深海冷蓝：最外圈
    teal:  '#2FBFA0', // 极光青：主色
    mint:  '#8AE6C0', // 薄荷青：最亮处
    cream: '#F0D8A8'  // 暖米金：唯一暖色
  };

  /* ---------- 2. 构图参数（改这些数字就能重构整张画面） ---------- */
  const RING_COUNT  = 24;      // 同心弧的道数（for 循环生成）
  const BLADE_COUNT = 84;      // 从圆心放射的细线数量
  const GRAIN_COUNT = 4200;    // 胶片颗粒
  const FOCUS_X = 0.40;        // 圆心横向位置（偏左，右侧留白）
  const FOCUS_Y = 0.52;        // 圆心纵向位置（略低于中线）
  const CREAM_INDEX = 17;      // 第几道弧用暖色
  const DRIFT_X = 0.055;       // 圆心逐环偏移量 → 隧道式纵深
  const DRIFT_Y = -0.030;

  let unit = 1;

  /* ---------- 3. 初始化：跑一次，画面即定格 ---------- */
  function setup() {
    const canvas = createCanvas(windowWidth, windowHeight);
    canvas.style('display', 'block');
    noiseDetail(4, 0.55);
    unit = Math.min(width, height) / 900;

    renderScene();          // 静态图：画完即结束，没有 draw() 循环
  }

  /* ---------- 4. 渲染 ---------- */
  function renderScene() {
    background(COLORS.night);
    drawGround();
    drawRingGlow();         // 先铺一层模糊的辉光
    drawRings();            // 再叠清晰的结构
    drawBlades();
    drawCore();
    drawVignette();
    drawGrain();
  }

  /* 底色：从圆心向外的一层极淡冷光，托住弧线 */
  function drawGround() {
    const ctx = drawingContext;
    const cx = width * FOCUS_X;
    const cy = height * FOCUS_Y;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height) * 0.78);
    g.addColorStop(0.00, 'rgba(18, 48, 90, 0.50)');
    g.addColorStop(0.35, 'rgba(10, 22, 44, 0.30)');
    g.addColorStop(1.00, 'rgba(5, 8, 16, 0.00)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, width, height);
  }

  /* ---------- 5. 单道弧的几何参数（绘制与辉光共用同一套数据） ---------- */
  function ringParams(i) {
    const t = i / (RING_COUNT - 1);                       // 0..1：从内到外
    const maxRadius = Math.min(width, height) * 0.86;

    const radius = maxRadius * 0.05 + maxRadius * Math.pow(t, 1.22) *
                   (1 + (noise(i * 3.7, 1.5) - 0.5) * 0.05);
    // 线宽：中段最粗、内外两端收细 → 形成明显的节奏
    const weight = (0.6 + 9.0 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.9)), 1.4)) * unit;
    let alpha = 16 + 96 * Math.sin(Math.PI * Math.pow(t, 0.8));

    let c;
    if (i === CREAM_INDEX) { c = color(COLORS.cream); alpha = Math.min(255, alpha * 1.5); }
    else if (t < 0.5)      c = lerpColor(color(COLORS.deep), color(COLORS.teal), t / 0.5);
    else                   c = lerpColor(color(COLORS.teal), color(COLORS.mint), (t - 0.5) / 0.5);

    return {
      cx: width * FOCUS_X + Math.pow(t, 1.6) * width * DRIFT_X,
      cy: height * FOCUS_Y + Math.pow(t, 1.6) * height * DRIFT_Y,
      radius: radius,
      weight: weight,
      alpha: alpha,
      color: c,
      start: noise(i * 5.3, 8.1) * TWO_PI,
      sweep: TWO_PI * (0.50 + 0.50 * noise(i * 2.1, 4.4))
    };
  }

  /* ---------- 6. 辉光：把同一组弧画进缓冲，模糊后贴回 ---------- */
  function drawRingGlow() {
    const layer = createGraphics(width, height);
    const lctx = layer.drawingContext;
    lctx.lineCap = 'round';
    lctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < RING_COUNT; i++) {
      const r = ringParams(i);
      lctx.strokeStyle = 'rgba(' + red(r.color) + ',' + green(r.color) + ',' + blue(r.color) + ',' +
                         (r.alpha / 255 * 0.55) + ')';
      lctx.lineWidth = r.weight * 2.2;
      lctx.beginPath();
      lctx.arc(r.cx, r.cy, r.radius, r.start, r.start + r.sweep);
      lctx.stroke();
    }

    const ctx = drawingContext;
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(' + (9 * unit) + 'px)';
    ctx.globalAlpha = 0.85;
    ctx.drawImage(layer.canvas, 0, 0);
    ctx.filter = 'blur(' + (34 * unit) + 'px)';
    ctx.globalAlpha = 0.45;
    ctx.drawImage(layer.canvas, 0, 0);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    layer.remove();
  }

  /* ---------- 7. 24 道清晰的同心弧 ---------- */
  function drawRings() {
    push();
    noFill();
    strokeCap(ROUND);
    for (let i = 0; i < RING_COUNT; i++) {
      const r = ringParams(i);
      stroke(red(r.color), green(r.color), blue(r.color), r.alpha);
      strokeWeight(r.weight);
      arc(r.cx, r.cy, r.radius * 2, r.radius * 2, r.start, r.start + r.sweep);

      // 弧头收笔：两端各点一个小圆，收得干净
      noStroke();
      fill(red(r.color), green(r.color), blue(r.color), r.alpha * 0.95);
      for (const a of [r.start, r.start + r.sweep]) {
        circle(r.cx + Math.cos(a) * r.radius, r.cy + Math.sin(a) * r.radius, r.weight * 0.92);
      }
      noFill();
    }
    pop();
  }

  /* ---------- 8. 放射细线：给同心结构一点"刺"与不对称 ---------- */
  function drawBlades() {
    const cx = width * FOCUS_X;
    const cy = height * FOCUS_Y;
    const maxRadius = Math.min(width, height) * 0.86;

    blendMode(ADD);
    strokeWeight(1 * unit);
    for (let i = 0; i < BLADE_COUNT; i++) {
      // 只在一段扇区内出现（约 110°），避免四面对称、过于呆板
      const a = -1.10 + (i / BLADE_COUNT) * 1.95 + (noise(i * 0.9, 2.2) - 0.5) * 0.02;
      const inner = maxRadius * (0.08 + 0.05 * noise(i * 1.7, 6.3));
      const outer = maxRadius * (0.45 + 0.50 * noise(i * 2.3, 9.1));
      const alpha = 5 + 22 * noise(i * 1.3, 3.7);

      stroke(138, 230, 192, alpha);
      line(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner,
           cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
    }
    blendMode(BLEND);
  }

  /* ---------- 9. 光核：整幅画最亮的地方，就是圆心 ---------- */
  function drawCore() {
    const ctx = drawingContext;
    const cx = width * FOCUS_X;
    const cy = height * FOCUS_Y;
    const r = Math.min(width, height) * 0.20;

    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0.00, 'rgba(255, 250, 236, 0.80)');
    g.addColorStop(0.14, 'rgba(240, 216, 168, 0.34)');
    g.addColorStop(0.48, 'rgba(138, 230, 192, 0.10)');
    g.addColorStop(1.00, 'rgba(47, 191, 160, 0.00)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 10. 暗角 ---------- */
  function drawVignette() {
    const ctx = drawingContext;
    const inner = Math.min(width, height) * 0.30;
    const outer = Math.max(width, height) * 0.92;
    const vignette = ctx.createRadialGradient(
      width * FOCUS_X, height * FOCUS_Y, inner,
      width * FOCUS_X, height * FOCUS_Y, outer
    );
    vignette.addColorStop(0, 'rgba(4, 6, 14, 0.00)');
    vignette.addColorStop(1, 'rgba(4, 6, 14, 0.72)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, width, height);
  }

  /* ---------- 11. 颗粒 ---------- */
  function drawGrain() {
    randomSeed(7);
    noStroke();
    for (let i = 0; i < GRAIN_COUNT; i++) {
      fill(255, 245, 226, random(3, 10));
      rect(random(width), random(height), random(1.0, 2.0), random(1.0, 2.0));
    }
  }

  /* ---------- 12. 窗口尺寸变化时重画（仍然没有 draw） ---------- */
  function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    unit = Math.min(width, height) / 900;
    renderScene();
  }
  </script>
</body>
</html>
